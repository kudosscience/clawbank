# cargo-deny configuration: advisories, banned crates, licenses, sources.
# Runs in CI (rust-audit job). The clarify entries below pin the license
# texts of crates whose manifests use the non-SPDX "MIT/Apache-2.0" form.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "warn"
notice = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "bitflags"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "LICENSE-MIT", hash = "6485b8ed310d3f0340bf1ad1f47645069ce4069dcc6bb46c7d5c6faf41de1fdb" },
    { path = "LICENSE-APACHE", hash = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2" },
]

