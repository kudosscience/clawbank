# CI: docs checks are live and required; Rust checks are scaffolded but
# dormant until a Cargo workspace lands (each rust-* job is skipped when
# no Cargo.toml exists, so main stays green). When Cargo.toml appears,
# add the rust-* context names to main's branch protection — no edits
# needed here. See ADR 0005/0006 for the safety/harness rationale.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          config: .github/markdownlint.json

  adr-check:
    name: adr-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/adr-check.sh

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 20
            --max-concurrency 8
            --accept 200,201,202,203,204,206,301,302,303,307,308
            "**/*.md"

  context-check:
    name: context-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/context-check.sh

  # NOTE: hashFiles() is not allowed in jobs.<id>.if, so each rust job
  # always runs but gates every step after checkout on a file probe.
  # Jobs report success-with-skipped-steps until the workspace lands.
  rust-fmt:
    name: rust-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: echo "cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cargo == 'true'
        with:
          components: rustfmt
      - if: steps.gate.outputs.cargo == 'true'
        run: cargo fmt --all -- --check

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: echo "cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cargo == 'true'
        with:
          components: clippy
      - if: steps.gate.outputs.cargo == 'true'
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: rust-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: echo "cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cargo == 'true'
      - if: steps.gate.outputs.cargo == 'true'
        run: cargo test --all

  rust-audit:
    name: rust-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: echo "lock=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.lock == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.lock == 'true'
        with:
          tool: cargo-audit
      - if: steps.gate.outputs.lock == 'true'
        run: cargo audit
      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.lock == 'true'
        with:
          tool: cargo-deny
      - if: steps.gate.outputs.lock == 'true'
        run: cargo deny check advisories bans licenses sources
